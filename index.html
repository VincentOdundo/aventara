<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The title, description, canonical URL, share tags and page structured
      data below are defaults. scripts/prerender.mjs replaces them for every
      route at build time with the values each page passes to useSeo().
      Prices never belong in this file: they come from src/data/packages.
    -->
    <title>Kenya &amp; Tanzania Budget Safaris from Nairobi | Cima Brava Adventures</title>
    <meta
      name="description"
      content="Shared and private 4x4 safaris across Kenya and Tanzania. Published per-person prices include park fees, accommodation, meals and transfers."
    />
    <meta name="author" content="Cima Brava Adventures" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cima Brava Adventures" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://cimabravasafaris.co.ke/" />
    <meta
      property="og:title"
      content="Kenya &amp; Tanzania Budget Safaris from Nairobi | Cima Brava Adventures"
    />
    <meta
      property="og:description"
      content="Shared and private 4x4 safaris across Kenya and Tanzania. Published per-person prices include park fees, accommodation, meals and transfers."
    />
    <meta
      property="og:image"
      content="https://cimabravasafaris.co.ke/og/home.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta
      property="og:image:alt"
      content="Wildlife on safari in East Africa with Cima Brava Adventures"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://cimabravasafaris.co.ke/" />
    <meta
      name="twitter:title"
      content="Kenya &amp; Tanzania Budget Safaris from Nairobi | Cima Brava Adventures"
    />
    <meta
      name="twitter:description"
      content="Shared and private 4x4 safaris across Kenya and Tanzania. Published per-person prices include park fees, accommodation, meals and transfers."
    />
    <meta
      name="twitter:image"
      content="https://cimabravasafaris.co.ke/og/home.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Wildlife on safari in East Africa with Cima Brava Adventures"
    />

    <!-- Canonical & AI/Markdown Discovery -->
    <link rel="canonical" href="https://cimabravasafaris.co.ke/" />
    <link rel="alternate" type="text/markdown" href="https://cimabravasafaris.co.ke/index.md" title="Markdown version" />
    <link rel="alternate" type="text/plain" href="https://cimabravasafaris.co.ke/llms.txt" title="LLM guide" />

    <!-- Google Fonts: Cinzel (Trajan Pro fallback), Inter, Montserrat, Caveat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />

    <!--
      Global entity graph shared across every route; page schemas point at
      #organization and #website by @id. scripts/prerender.mjs injects
      priceRange dynamically from src/data/packages.
    -->
    <script type="application/ld+json" id="org-jsonld">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "TravelAgency",
            "@id": "https://cimabravasafaris.co.ke/#organization",
            "name": "Cima Brava Adventures",
            "alternateName": ["Cima Brava", "Cima Brava Safaris"],
            "slogan": "Wild by Nature. Guided by Heart.",
            "url": "https://cimabravasafaris.co.ke/",
            "logo": {
              "@type": "ImageObject",
              "@id": "https://cimabravasafaris.co.ke/#logo",
              "url": "https://cimabravasafaris.co.ke/favicon.png"
            },
            "image": "https://cimabravasafaris.co.ke/og/home.jpg",
            "email": "cimabravaadventures@gmail.com",
            "telephone": "+254112346049",
            "currenciesAccepted": "USD",
            "description": "Nairobi-based operator running shared and private 4x4 safaris across Kenya and Tanzania.",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Nairobi",
              "addressCountry": "KE"
            },
            "geo": {
              "@type": "GeoCoordinates",
              "latitude": -1.2921,
              "longitude": 36.8219
            },
            "areaServed": [
              { "@type": "Country", "name": "Kenya" },
              { "@type": "Country", "name": "Tanzania" }
            ],
            "knowsAbout": [
              "Kenya Budget Safaris",
              "Tanzania Northern Circuit Safaris",
              "Masai Mara National Reserve",
              "Serengeti National Park",
              "Ngorongoro Crater",
              "Amboseli National Park",
              "Great Wildebeest Migration",
              "4x4 Safari Departures from Nairobi"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+254112346049",
              "email": "cimabravaadventures@gmail.com",
              "contactType": "reservations",
              "availableLanguage": ["English", "Swahili"],
              "areaServed": ["KE", "TZ"],
              "hoursAvailable": {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": [
                  "Monday",
                  "Tuesday",
                  "Wednesday",
                  "Thursday",
                  "Friday",
                  "Saturday",
                  "Sunday"
                ],
                "opens": "00:00",
                "closes": "23:59"
              }
            },
            "sameAs": [
              "https://www.tiktok.com/@cima_brava_adventures",
              "https://www.instagram.com/cima_brava_adventures",
              "https://www.facebook.com/share/187nSmsCH8/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://cimabravasafaris.co.ke/#website",
            "name": "Cima Brava Adventures",
            "url": "https://cimabravasafaris.co.ke/",
            "inLanguage": "en",
            "publisher": { "@id": "https://cimabravasafaris.co.ke/#organization" },
            "creator": {
              "@type": "Organization",
              "name": "BYND/LABS",
              "url": "https://bynd.co.ke/labs"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://cimabravasafaris.co.ke/safaris?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <meta name="theme-color" content="#2A1500" />
    <!--
      Icons: favicon.ico at the site root is the file Google and every browser
      look for first; the PNGs are multiples of 48px as Google's favicon
      guidance asks. scripts/build-assets.mjs regenerates all of them from
      public/favicon.png.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Scroll-reveal content stays visible by default for crawlers and slow loads. -->
    <noscript>
      <style>
        .animate-on-scroll,
        .animate-on-scroll-left,
        .animate-on-scroll-right,
        .animate-on-scroll-scale,
        .stagger-children > * {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
